services:
  - type: web
    name: algojury
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: ALGOJURY_LLM_URL
        sync: false
      - key: ALGOJURY_LLM_MODEL
        sync: false
